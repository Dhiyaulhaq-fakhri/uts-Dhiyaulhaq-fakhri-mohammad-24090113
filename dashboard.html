<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="layout">
        <aside class="sidebar">
            <nav>
                <a href="#"><img src="css/home.svg" alt=""></a>
                <a href="#"><img src="css/widget.svg" alt=""></a>
                <a href="#"><img src="css/revenue.svg" alt=""></a>
                <a href="#"><img src="css/statistic.svg" alt=""></a>
                <a href="#"><img src="css/setting.svg" alt=""></a>
            </nav>
        </aside>
        <main class="list_data">
            <h1>List data produk</h1>
            <div class="dashboard">
                <div class="topbar">
                    <div class="totalproduct">
                        <img src="css/keranjang.svg" alt="" srcset="">
                        <p>Total products</p>
                        <p id="showproduct"></p>
                    </div>
                    <div class="totalsales" id="btnlistproduct">
                        <img src="css/keranjang.svg" alt="" srcset="">
                        <p>Total sales</p>
                        <p id="showsales"></p>
                    </div>
                    <div class="revenue">
                        <img src="css/uang.svg" alt="" srcset="">
                        <p>Revenue</p>
                        <p id="showrevenue"></p>
                    </div>
                </div>
                <div class="belowbar">
                    <p class="produk"></p>
                </div>
            </div>
        </main>
    </div>
    <script src="js/script.js"></script>
</body>

</html>
