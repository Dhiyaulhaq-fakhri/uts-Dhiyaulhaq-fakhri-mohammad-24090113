<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="login-form">
        <div class="blok-kiri">
            <img src="css/img1.png" alt="ilustration" srcset="">
        </div>
        <div class="pembatas"></div>
        <div class="blok-kanan">
            <h1>Welcome Back!</h1>
            <div class="container">
                <form class="input">
                    <div class="grouped_input">
                        <input type="text" name="email" id="email" placeholder="Email">
                    </div>
                    <div class="grouped_input">
                        <input type="text" name="password" id="password" placeholder="Password">
                    </div>
                    <p id="errorMsg" style="color:red; font-size:14px; margin:0;"></p>
                    <p class="forgot">Forgot password?</p>
                    <button type="button" class="button_1" id="tombol_login">Login</button>
                    <p class="or">or</p>
                    <div class="alternatif">
                        <div class="grouped_input1">
                            <button type="button" class="button" id="google">Google</button>
                        </div>
                        <div class="grouped_input1">
                            <button type="button" class="button" id="facebook">Facebook</button>
                        </div>
                    </div>
                    <p class="sign_up">Dont have account? | sign up</p>
                </form>
            </div>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>

</html>
